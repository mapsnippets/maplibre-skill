<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MapLibre GL JS — Basic Vector Map (MapTiler Streets v4)</title>
  <link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { width: 100%; height: 100%; overflow: hidden; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    #map { width: 100%; height: 100%; }
    .hud-card {
      position: absolute;
      top: 16px;
      left: 16px;
      z-index: 10;
      background: rgba(11, 17, 24, 0.85);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(0, 210, 255, 0.3);
      border-radius: 8px;
      padding: 14px 18px;
      color: #ffffff;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
      max-width: 320px;
    }
    .hud-title { font-size: 15px; font-weight: 700; color: #00D2FF; margin-bottom: 4px; display: flex; align-items: center; gap: 8px; }
    .hud-desc { font-size: 12px; color: #94a3b8; line-height: 1.4; }
  </style>
</head>
<body>
  <div class="hud-card">
    <div class="hud-title">📍 MapLibre GL JS v4</div>
    <div class="hud-desc">Rendered with MapTiler Streets v4 high-performance vector basemap tiles.</div>
  </div>

  <div id="map"></div>

  <script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
  <script>
    // Prompt rule invariant: Require API Key or prompt user
    const apiKey = new URLSearchParams(window.location.search).get('key') || 'YOUR_MAPTILER_API_KEY';

    const map = new maplibregl.Map({
      container: 'map',
      style: `https://api.maptiler.com/maps/streets-v4/style.json?key=${apiKey}`,
      center: [14.42076, 50.08804], // [lng, lat] Prague
      zoom: 13,
      pitch: 0,
      bearing: 0
    });

    // Add navigation and interactive controls
    map.addControl(new maplibregl.NavigationControl({ visualizePitch: true }), 'top-right');
    map.addControl(new maplibregl.FullscreenControl(), 'top-right');
    map.addControl(new maplibregl.ScaleControl({ maxWidth: 100, unit: 'metric' }), 'bottom-left');

    map.on('load', () => {
      // Add a sample marker
      const markerEl = document.createElement('div');
      markerEl.style.width = '24px';
      markerEl.style.height = '24px';
      markerEl.style.borderRadius = '50%';
      markerEl.style.backgroundColor = '#0084FF';
      markerEl.style.border = '3px solid #ffffff';
      markerEl.style.boxShadow = '0 0 12px rgba(0, 132, 255, 0.8)';

      new maplibregl.Marker({ element: markerEl })
        .setLngLat([14.42076, 50.08804])
        .setPopup(new maplibregl.Popup({ offset: 25 }).setHTML('<strong>Old Town Square</strong><p>Prague, Czech Republic</p>'))
        .addTo(map);
    });
  </script>
</body>
</html>
